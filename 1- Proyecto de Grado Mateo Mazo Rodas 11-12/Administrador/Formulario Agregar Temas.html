    <section class="tab-components">

        <div class="card-style mb-30">
          <h6 class="mb-25">Nuevo Tema</h6>
          <div class="select-style-1">
            <label>Área</label>
            <div class="select-position">

            </div>
          </div>

          <button id="btnGuardar" class="main-btn success-btn-outline btn-hover mt-10">Añadir Tema</button>
          <p id="msg" style="margin-top:10px;"></p>
        </div>

        <div class="card-style mb-30">
          <h6 class="mb-25">Temas registrados</h6>

    <!-- Modal editar tema -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Editar Tema</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3"><label class="form-label">Nombre del Tema</label><input type="text" class="form-control" id="edit-nombre"></div>
            <div class="mb-3"><label class="form-label">Competencia</label><input type="text" class="form-control" id="edit-competencia"></div>
            <div class="mb-3"><label class="form-label">Área</label>
              <select class="form-select" id="edit-area"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarEdicion()">Guardar</button>
          </div>
        </div>
      </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    var areasMap = {};
    var _temasData = [];

    getAreas().then(function(areas) {
      var sel = document.getElementById('selectArea');
      var selEdit = document.getElementById('edit-area');
      areas.forEach(function(a) {
        areasMap[a.CodArea] = a.NombreArea;
        var opt = document.createElement('option');
        opt.value = a.CodArea; opt.textContent = a.NombreArea;
        sel.appendChild(opt);
        var opt2 = opt.cloneNode(true);
        selEdit.appendChild(opt2);
      });
    });

    function cargarTabla() {
      getTemas().then(function(data) {
        _temasData = data;
        var tbody = document.getElementById('tbodyTemas');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="5">Sin registros</td></tr>'; return; }
        tbody.innerHTML = data.map(function(t, i) {
          return '<tr><td>' + (i+1) + '</td><td>' + t.NombreTema + '</td><td>' + t.Competencia + '</td><td>' + (areasMap[t.CodArea] || t.CodArea) + '</td>' +
            '<td>' +
              '<button class="btn btn-sm btn-warning me-1" onclick="abrirEditar(' + t.CodTema + ')">✏️ Editar</button>' +
              '<button class="btn btn-sm btn-danger" onclick="eliminar(' + t.CodTema + ')">🗑️ Eliminar</button>' +
            '</td></tr>';
        }).join('');
      });
    }
    cargarTabla();

    document.getElementById('btnGuardar').addEventListener('click', async function() {
      var msg = document.getElementById('msg');
      var data = {
        NombreTema: document.getElementById('nombreTema').value.trim(),
        Competencia: document.getElementById('competencia').value.trim(),
        CodArea: document.getElementById('selectArea').value
      };
      if (!data.NombreTema || !data.CodArea) {
        msg.style.color = 'red'; msg.textContent = 'Selecciona un área y escribe el tema.'; return;
      }
      try {
        await crearTema(data);
        msg.style.color = 'green'; msg.textContent = 'Tema guardado.';
        document.getElementById('nombreTema').value = '';
        document.getElementById('competencia').value = '';
        cargarTabla();
      } catch(e) { msg.style.color = 'red'; msg.textContent = 'Error al guardar.'; }
    });

    function abrirEditar(id) {
      var t = _temasData.find(function(x) { return x.CodTema === id; });
      if (!t) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-nombre').value = t.NombreTema;
      document.getElementById('edit-competencia').value = t.Competencia;
      document.getElementById('edit-area').value = t.CodArea;
      new bootstrap.Modal(document.getElementById('modalEditar')).show();
    }

    async function guardarEdicion() {
      var id = document.getElementById('edit-id').value;
      var data = {
        NombreTema: document.getElementById('edit-nombre').value.trim(),
        Competencia: document.getElementById('edit-competencia').value.trim(),
        CodArea: document.getElementById('edit-area').value
      };
      await fetch('http://localhost:3000/api/temas/' + id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      bootstrap.Modal.getInstance(document.getElementById('modalEditar')).hide();
      cargarTabla();
    }

    async function eliminar(id) {
      if (!confirm('¿Eliminar este tema?')) return;
      await fetch('http://localhost:3000/api/temas/' + id, { method: 'DELETE' });
      cargarTabla();
    }
  </script>
