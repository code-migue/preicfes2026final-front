          <div class="input-style-1"><label>Nombre de usuario</label><input type="text" id="nombreUsuario" placeholder="Ej. mhajin123" /></div>
          <div class="input-style-1"><label>Correo</label><input type="text" id="correoUsuario" placeholder="abc123@gmail.com" /></div>

        </div>

    <!-- Modal editar usuario -->

          <div class="modal-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3"><label class="form-label">Nombre de usuario</label><input type="text" class="form-control" id="edit-nombre"></div>
            <div class="mb-3"><label class="form-label">Correo</label><input type="text" class="form-control" id="edit-correo"></div>
            <div class="mb-3"><label class="form-label">Nueva contraseña (dejar vacío para no cambiar)</label><input type="password" class="form-control" id="edit-clave"></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarEdicion()">Guardar</button>
          </div>
        </div>
      </div>

  <script>
    var _usuariosData = [];

    function cargarTabla() {
      getUsuarios().then(function(data) {
        _usuariosData = data;
        var tbody = document.getElementById('tbodyUsuarios');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="4">Sin registros</td></tr>'; return; }
        tbody.innerHTML = data.map(function(u, i) {
          return '<tr><td>' + (i+1) + '</td><td>' + u.NombreUsuario + '</td><td>' + u.Correo + '</td>' +
            '<td>' +
              '<button class="btn btn-sm btn-warning me-1" onclick="abrirEditar(' + u.CodUsuario + ')">✏️ Editar</button>' +
              '<button class="btn btn-sm btn-danger" onclick="eliminar(' + u.CodUsuario + ')">🗑️ Eliminar</button>' +
            '</td></tr>';
        }).join('');
      });
    }
    cargarTabla();

    document.getElementById('btnGuardar').addEventListener('click', async function() {
      var msg = document.getElementById('msg');
      var clave = document.getElementById('claveUsuario').value;
      if (clave !== document.getElementById('claveConfirm').value) {
        msg.style.color = 'red'; msg.textContent = 'Las contraseñas no coinciden.'; return;
      }
      var data = { NombreUsuario: document.getElementById('nombreUsuario').value.trim(), Correo: document.getElementById('correoUsuario').value.trim(), Contraseña: clave, CodEstudiante: null };
      if (!data.NombreUsuario || !data.Correo || !data.Contraseña) {
        msg.style.color = 'red'; msg.textContent = 'Completa todos los campos.'; return;
      }
      try {
        await crearUsuario(data);
        msg.style.color = 'green'; msg.textContent = 'Usuario guardado.';
        document.getElementById('nombreUsuario').value = '';
        document.getElementById('correoUsuario').value = '';
        document.getElementById('claveUsuario').value = '';
        document.getElementById('claveConfirm').value = '';
        cargarTabla();
      } catch(e) { msg.style.color = 'red'; msg.textContent = 'Error al guardar.'; }
    });

    function abrirEditar(id) {
      var u = _usuariosData.find(function(x) { return x.CodUsuario === id; });
      if (!u) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-nombre').value = u.NombreUsuario;
      document.getElementById('edit-correo').value = u.Correo;
      document.getElementById('edit-clave').value = '';
      new bootstrap.Modal(document.getElementById('modalEditar')).show();
    }

    async function guardarEdicion() {
      var id = document.getElementById('edit-id').value;
      var data = {
        NombreUsuario: document.getElementById('edit-nombre').value.trim(),
        Correo: document.getElementById('edit-correo').value.trim()
      };
      var clave = document.getElementById('edit-clave').value;
      if (clave) data.Contraseña = clave;
      await actualizarUsuario(id, data);
      bootstrap.Modal.getInstance(document.getElementById('modalEditar')).hide();
      cargarTabla();
    }

    async function eliminar(id) {
      if (!confirm('¿Eliminar este usuario?')) return;
      await eliminarUsuario(id);
      cargarTabla();
    }
  </script>
