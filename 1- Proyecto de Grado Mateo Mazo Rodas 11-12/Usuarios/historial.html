  <script>
    var sesion = JSON.parse(sessionStorage.getItem('sesion') || localStorage.getItem('sesion') || 'null');
    var contenido = document.getElementById('historial-contenido');

    if (!sesion || !sesion.CodUsuario) {
      contenido.innerHTML = '<p>No se pudo obtener la sesión.</p>';
    } else {
      getIntentosPorUsuario(sesion.CodUsuario).then(function(intentos) {
        if (intentos.length === 0) {
          contenido.innerHTML = '<p style="color:#888;">Aún no has realizado ningún simulacro.</p>';
          return;
        }
        var html = '<table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Puntaje</th></tr></thead><tbody>';
        intentos.forEach(function(i) {
          html += '<tr><td>' + i.Fecha + '</td><td>' + (i.Descripcion || '-') + '</td><td>' + i.Puntaje + '</td></tr>';
        });
        html += '</tbody></table>';
        contenido.innerHTML = html;
      }).catch(function() {
        contenido.innerHTML = '<p style="color:red;">Error al cargar el historial.</p>';
      });
    }
  </script>
