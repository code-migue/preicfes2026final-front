  <script src="../assets/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/api.js"></script>
  <script>
    var preguntas = [];
    var respuestasSeleccionadas = {};

    var params = new URLSearchParams(window.location.search);
    var codArea = params.get('area');
    var modo = params.get('modo');

    async function cargar() {
      try {
        if (modo === 'aleatorio') {
          preguntas = await getPreguntasAleatorio();
          document.getElementById('titulo-simulacro').textContent = 'Simulacro General';
          document.getElementById('subtitulo-simulacro').textContent = 'Combinación aleatoria de todas las áreas';
        } else if (codArea) {
          preguntas = await getPreguntasPorArea(codArea);
          var areas = await getAreas();
          var area = areas.find(function(a) { return a.CodArea == codArea; });
          document.getElementById('titulo-simulacro').textContent = area ? area.NombreArea : 'Simulacro';
          document.getElementById('subtitulo-simulacro').textContent = preguntas.length + ' preguntas';
        }

        document.getElementById('cargando').style.display = 'none';

        if (preguntas.length === 0) {
          document.getElementById('simulacro-contenido').style.display = 'block';
          document.getElementById('preguntas-container').innerHTML = '<p style="text-align:center;color:#888;">No hay preguntas disponibles para esta área todavía.</p>';
          document.getElementById('btnEntregar').style.display = 'none';
          return;
        }

        renderPreguntas();
        document.getElementById('simulacro-contenido').style.display = 'block';
      } catch(e) {
        document.getElementById('cargando').innerHTML = '<p style="color:red;">Error al cargar las preguntas. Verifica que el servidor esté corriendo.</p>';
      }
    }

    function limpiar(str) {
      if (!str) return '';
      return str.replace(/^'|'$/g, '');
    }

    function renderPreguntas() {
      var container = document.getElementById('preguntas-container');
      container.innerHTML = '';
      preguntas.forEach(function(p, idx) {
        var card = document.createElement('div');
        card.className = 'pregunta-card';
        var html = '<div class="pregunta-num">Pregunta ' + (idx + 1) + ' de ' + preguntas.length + '</div>';
        html += '<div class="pregunta-texto">' + limpiar(p.TextoPregunta) + '</div>';
        p.respuestas.forEach(function(r) {
          var estadoLimpio = limpiar(r.Estado);
          html += '<div class="opcion" data-preg="' + p.CodPregunta + '" data-resp="' + r.CodRespuesta + '" data-estado="' + estadoLimpio + '">' +
            '<span>' + limpiar(r.TextoRespuesta) + '</span></div>';
        });
        card.innerHTML = html;
        container.appendChild(card);
      });

      document.querySelectorAll('.opcion').forEach(function(el) {
        el.addEventListener('click', function() {
          var codPreg = this.getAttribute('data-preg');
          document.querySelectorAll('.opcion[data-preg="' + codPreg + '"]').forEach(function(o) {
            o.classList.remove('seleccionada');
          });
          this.classList.add('seleccionada');
          respuestasSeleccionadas[codPreg] = {
            codResp: this.getAttribute('data-resp'),
            estado: this.getAttribute('data-estado')
          };
          actualizarBarra();
        });
      });
    }

    function actualizarBarra() {
      var respondidas = Object.keys(respuestasSeleccionadas).length;
      var pct = preguntas.length > 0 ? (respondidas / preguntas.length * 100) : 0;
      document.getElementById('barra-fill').style.width = pct + '%';
    }

    document.getElementById('btnEntregar').addEventListener('click', async function() {
      var correctas = 0;
      preguntas.forEach(function(p) {
        var sel = respuestasSeleccionadas[p.CodPregunta];
        document.querySelectorAll('.opcion[data-preg="' + p.CodPregunta + '"]').forEach(function(o) {
          var est = o.getAttribute('data-estado');
          if (est === 'Correcta') o.classList.add('correcta');
        });
        if (sel) {
          var esCorrecta = sel.estado === 'Correcta';
          if (esCorrecta) { correctas++; }
          else {
            var el = document.querySelector('.opcion[data-preg="' + p.CodPregunta + '"][data-resp="' + sel.codResp + '"]');
            if (el) el.classList.add('incorrecta');
          }
        }
      });

      var puntaje = preguntas.length > 0 ? Math.round((correctas / preguntas.length) * 500) : 0;

      try {
        var sesion = JSON.parse(sessionStorage.getItem('sesion') || localStorage.getItem('sesion') || 'null');
        if (sesion && sesion.CodUsuario) {
          await crearIntento({
            CodUsuario: sesion.CodUsuario,
            Fecha: new Date().toISOString().slice(0, 10),
            Puntaje: puntaje,
            Descripcion: modo === 'aleatorio' ? 'Simulacro General' : 'Área ' + codArea
          });
        }
      } catch(e) {}

      document.getElementById('simulacro-contenido').querySelector('#btnEntregar').style.display = 'none';
      document.querySelectorAll('.opcion').forEach(function(o) { o.style.pointerEvents = 'none'; });

      document.getElementById('resultado-final').style.display = 'block';
      document.getElementById('puntaje-texto').textContent = correctas + ' / ' + preguntas.length + ' correctas';
      document.getElementById('detalle-resultado').textContent = 'Puntaje estimado: ' + puntaje + ' puntos';
      document.getElementById('resultado-final').scrollIntoView({ behavior: 'smooth' });
    });

    cargar();
  </script>
