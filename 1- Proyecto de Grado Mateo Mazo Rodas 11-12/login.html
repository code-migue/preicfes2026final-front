<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión | PREICFES</title>
    <link rel="icon" href="assets/images/preicfes-favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/preicfes/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
  <body>
    <div class="pagina">
      <section class="arte" aria-label="PREICFES">
        <svg id="burbujas" aria-hidden="true"></svg>
        <a class="logo-enlace" href="index.html" aria-label="PREICFES, ir al inicio"><img class="logo" src="assets/images/logo/preicfes-blanco.svg" alt="PREICFES" /></a>
        <div class="mensaje">
          <h2>Cada respuesta te acerca a tu mejor puntaje.</h2>
          <p>Practica con simulacros del examen Saber 11 y mide tu avance en cada área.</p>
        </div>
      </section>

      <main class="acceso">
        <a class="volver" href="index.html">Volver al inicio</a>
        <div class="caja">
          <h1>Bienvenido de nuevo</h1>
          <p class="sub">Elige cómo vas a entrar y escribe tus datos.</p>

          <form id="formLogin" novalidate>
            <fieldset>
              <legend>Ingresar como</legend>
              <div class="roles">
                <label class="rol">
                  <input type="radio" name="rol" value="estudiante" checked />
                  <span class="opcion">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
                    Estudiante
                    <span class="punto"></span>
                  </span>
                </label>
                <label class="rol">
                  <input type="radio" name="rol" value="administrador" />
                  <span class="opcion">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
                    Administrador
                    <span class="punto"></span>
                  </span>
                </label>
              </div>
            </fieldset>

            <div class="campo">
              <label for="correo">Correo</label>
              <input type="email" id="correo" placeholder="correo@ejemplo.com" autocomplete="username" />
            </div>

            <div class="campo">
              <label for="clave">Contraseña</label>
              <div class="clave-wrap">
                <input type="password" id="clave" placeholder="Tu contraseña" autocomplete="current-password" />
                <button type="button" id="verClave" class="ver" aria-pressed="false">Mostrar</button>
              </div>
            </div>

            <label class="recordar">
              <input type="checkbox" id="recordar" />
              Mantener la sesión iniciada
            </label>

            <p id="mensaje" class="error" role="alert"></p>
            <button type="submit" class="entrar">Entrar</button>
          </form>
        </div>
        <p class="pie">PREICFES, preparación para el examen Saber 11.</p>
      </main>
    </div>

    <script src="assets/js/burbujas.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
